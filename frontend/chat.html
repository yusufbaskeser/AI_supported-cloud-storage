<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat — SynapseCloud</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/public/index.css" />
  <link rel="stylesheet" href="css/app/app.css" />
  <link rel="stylesheet" href="css/app/chat.css" />
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('sc-theme')||'light');</script>
</head>
<body class="app-body">

  <div id="navbar-placeholder"></div>

  <main class="chat-main">
    <div class="chat-col">

      <div class="chat-messages" id="chatMessages">
        <div class="chat-welcome" id="chatWelcome">
          <div class="orb" id="chatOrb"></div>
          <div class="chat-welcome-copy">
            <h1 class="chat-welcome-name">Hello, <span id="chatWelcomeName">there</span></h1>
            <p class="chat-welcome-sub">Ask me anything about your files and workspaces.</p>
          </div>
          <div class="chat-suggestions">
            <button class="chat-suggestion" onclick="sendSuggestion(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
              <div class="chat-suggestion-text">
                <span class="chat-suggestion-title">What files do I have?</span>
                <span class="chat-suggestion-sub">Browse all your uploads</span>
              </div>
            </button>
            <button class="chat-suggestion" onclick="sendSuggestion(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
              <div class="chat-suggestion-text">
                <span class="chat-suggestion-title">Show my storage stats</span>
                <span class="chat-suggestion-sub">Size, count &amp; top tags</span>
              </div>
            </button>
            <button class="chat-suggestion" onclick="sendSuggestion(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <div class="chat-suggestion-text">
                <span class="chat-suggestion-title">Find my recent uploads</span>
                <span class="chat-suggestion-sub">Your latest files</span>
              </div>
            </button>
            <button class="chat-suggestion" onclick="sendSuggestion(this)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              <div class="chat-suggestion-text">
                <span class="chat-suggestion-title">List my workspaces</span>
                <span class="chat-suggestion-sub">See all your folders</span>
              </div>
            </button>
          </div>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="chat-input-wrap">
          <textarea id="chatInput" class="chat-input" placeholder="Ask about your files…" rows="1"></textarea>
          <button class="chat-send-btn" id="chatSendBtn" onclick="sendMessage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <div class="chat-input-footer">
          <p class="chat-hint">SynapseCloud AI · answers are based on your uploaded files</p>
          <button class="chat-clear-btn" id="clearChatBtn" onclick="clearChat()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            Clear
          </button>
        </div>
      </div>

    </div>
  </main>

  <footer class="chat-footer">© 2026 SynapseCloud · All rights reserved.</footer>

  <script src="js/fetch/app/chat-fetch.js"></script>
  <script src="js/fetch/app/file-fetch.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app/app-common.js"></script>
  <script src="js/app/chat.js"></script>
</body>
</html>
