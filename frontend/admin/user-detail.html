<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Detail — SynapseCloud Admin</title>
  <link rel="icon" type="image/png" href="../assets/logo.png" />
  <link rel="stylesheet" href="../css/admin/admin.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">
    <img src="../assets/logo.png" alt="SynapseCloud" />
    <span class="topbar-brand-name">Synapse<span>Cloud</span></span>
    <span class="topbar-badge">Admin</span>
  </div>

  <div class="topbar-sep"></div>

  <div class="topbar-breadcrumb">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
    <a href="./index" style="color:inherit;text-decoration:none">Dashboard</a>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    <span class="bc-page" id="bc-name">User Detail</span>
  </div>

  <div class="topbar-right">
    <button class="btn-theme" id="theme-btn" title="Toggle theme"><img id="theme-icon" src="../assets/icons/sun.svg" alt="" /></button>
    <div class="topbar-user">
      <div class="topbar-avatar" id="admin-avatar">A</div>
      <div class="topbar-user-info">
        <div class="topbar-user-name" id="admin-name">Admin</div>
        <div class="topbar-user-role" id="admin-role">super</div>
      </div>
    </div>
    <button class="btn-logout" id="logout-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </div>
</header>

<main class="page-body">

  <div class="page-head">
    <button class="back-btn" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back
    </button>
    <div>
      <div class="page-head-title" id="page-title">Loading…</div>
      <div class="page-head-sub" id="page-sub"></div>
    </div>
  </div>

  <div id="main-content">
    <div class="spin-wrap" style="padding:60px"><div class="spinner"></div></div>
  </div>

</main>

<script src="../js/config.js"></script>
<script src="../js/fetch/admin/admin-fetch.js"></script>
<script src="../js/admin/user-detail.js"></script>
</body>
</html>
