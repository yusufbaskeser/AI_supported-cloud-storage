<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — SynapseCloud</title>
  <link rel="icon" type="image/png" href="../assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #060910;
      color: #eef2ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(37,99,235,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card {
      background: #0c1120;
      border: 1px solid #1c2840;
      border-radius: 14px;
      padding: 36px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 28px 72px rgba(0,0,0,0.55);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: 50%; transform: translateX(-50%);
      width: 60%; height: 1px;
      background: linear-gradient(90deg, transparent, #3b82f6, transparent);
    }

    .header { display: flex; flex-direction: column; align-items: center; margin-bottom: 28px; }
    .logo { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .logo img { width: 28px; height: 28px; border-radius: 7px; }
    .logo-name { font-size: 1rem; font-weight: 700; color: #eef2ff; }
    .logo-name span { color: #3b82f6; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #60a5fa;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .title { font-size: 1.2rem; font-weight: 700; color: #eef2ff; }
    .subtitle { font-size: 0.78rem; color: #3d5070; margin-top: 4px; }

    /* field */
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
    .field label { font-size: 0.76rem; font-weight: 500; color: #5a7099; }
    .input-wrap { position: relative; }
    .input-wrap img {
      position: absolute;
      left: 11px; top: 50%; transform: translateY(-50%);
      width: 15px; height: 15px;
      filter: brightness(0) saturate(0) brightness(0.5);
      pointer-events: none;
    }
    input {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 10px 12px 10px 36px;
      background: #07090f;
      border: 1px solid #1c2840;
      border-radius: 8px;
      color: #eef2ff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }
    input::placeholder { color: #1e2d42; }
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
    }

    button[type="submit"] {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 11px;
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      margin-top: 4px;
    }
    button[type="submit"]:hover:not(:disabled) { background: #1d4ed8; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    .msg {
      margin-top: 12px;
      padding: 10px 13px;
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.45;
      display: none;
    }
    .msg.err    { display: block; background: rgba(239,68,68,0.09); border: 1px solid rgba(239,68,68,0.22); color: #f87171; }
    .msg.denied { display: block; background: rgba(245,158,11,0.09); border: 1px solid rgba(245,158,11,0.22); color: #fbbf24; }
    .msg.ok     { display: block; background: rgba(34,197,94,0.09); border: 1px solid rgba(34,197,94,0.22); color: #4ade80; }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 0.7rem;
      color: #1e2d42;
    }
    .footer a { color: #1e2d42; text-decoration: underline; }
    .footer a:hover { color: #3d5070; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        <img src="../assets/logo.png" alt="SynapseCloud" />
        <span class="logo-name">Synapse<span>Cloud</span></span>
      </div>
      <div class="badge">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Admin Panel
      </div>
      <div class="title">Administrator Login</div>
      <div class="subtitle">Restricted access — authorized personnel only</div>
    </div>

    <form id="form" onsubmit="doLogin(event)">
      <div class="field">
        <label for="name">Username</label>
        <div class="input-wrap">
          <img src="../assets/icons/user.svg" alt="" />
          <input id="name" type="text" placeholder="Enter username" autocomplete="username" required />
        </div>
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <div class="input-wrap">
          <img src="../assets/icons/lock.svg" alt="" />
          <input id="pass" type="password" placeholder="Enter password" autocomplete="current-password" required />
        </div>
      </div>
      <button type="submit" id="submitBtn">Sign In</button>
      <div class="msg" id="msg"></div>
    </form>

    <div class="footer">
      Session expires with token &nbsp;·&nbsp;
      <a href="../login">Back to app</a>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000/api/v1';

    function parseJwt(t) {
      try { return JSON.parse(atob(t.split('.')[1])); } catch { return null; }
    }

    function isAdminRole(role) {
      return role === 'super' || role === 'editor' || role === 'viewer';
    }

    (function check() {
      const t = sessionStorage.getItem('sc-admin-token');
      if (!t) return;
      const p = parseJwt(t);
      if (p && isAdminRole(p.role)) {
        window.location.replace('./index');
      }
    })();

    function showMsg(text, type) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    async function doLogin(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const pass = document.getElementById('pass').value;
      const btn  = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.textContent = 'Signing in...';
      document.getElementById('msg').className = 'msg';

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, password: pass }),
        });
        const data = await res.json();

        if (!res.ok) {
          showMsg(data.message || 'Invalid username or password.', 'err');
          return;
        }

        const payload = parseJwt(data.token);

        if (!payload || !isAdminRole(payload.role)) {
          showMsg('This account does not have admin privileges (super, editor, or viewer required).', 'denied');
          return;
        }

        sessionStorage.setItem('sc-admin-token', data.token);
        showMsg('Access granted. Redirecting...', 'ok');
        setTimeout(() => window.location.replace('./index'), 600);

      } catch {
        showMsg('Cannot reach server. Make sure the app is running.', 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
