<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — SynapseCloud</title>
  <link rel="icon" type="image/png" href="../assets/logo.png" />
  <link rel="stylesheet" href="../css/admin/admin.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-brand">
    <img src="../assets/logo.png" alt="SynapseCloud" />
    <span class="topbar-brand-name">Synapse<span>Cloud</span></span>
    <span class="topbar-badge">Admin</span>
  </div>

  <div class="topbar-sep"></div>

  <div class="topbar-breadcrumb">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
    <span class="bc-page">Dashboard</span>
  </div>

  <div class="topbar-right">
    <button class="btn-theme" id="theme-btn" title="Toggle theme"><img id="theme-icon" src="../assets/icons/sun.svg" alt="" /></button>
    <div class="topbar-user">
      <div class="topbar-avatar" id="admin-avatar">A</div>
      <div class="topbar-user-info">
        <div class="topbar-user-name" id="admin-name">Admin</div>
        <div class="topbar-user-role" id="admin-role">super</div>
      </div>
    </div>
    <button class="btn-logout" id="logout-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Sign out
    </button>
  </div>
</header>

<main class="page-body">

  <div class="dash-top">
    <div class="chart-card">
      <div class="chart-card-title">User Overview</div>
      <div class="donut-wrap">
        <svg id="donut-svg" viewBox="0 0 220 220"></svg>
      </div>
      <div class="donut-legend" id="donut-legend"></div>
    </div>

    <div class="stats-side" id="stats-grid">
      <div class="stat-card c-blue">
        <div class="stat-card-top">
          <div class="stat-card-label">Total Files</div>
          <div class="stat-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg></div>
        </div>
        <div class="stat-card-val" id="stat-files">—</div>
        <div class="stat-card-sub">Uploaded to storage</div>
      </div>
      <div class="stat-card c-purple">
        <div class="stat-card-top">
          <div class="stat-card-label">Workspaces</div>
          <div class="stat-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
        </div>
        <div class="stat-card-val" id="stat-ws">—</div>
        <div class="stat-card-sub">Active workspaces</div>
      </div>
      <div class="stat-card c-green">
        <div class="stat-card-top">
          <div class="stat-card-label">Storage Used</div>
          <div class="stat-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg></div>
        </div>
        <div class="stat-card-val" id="stat-storage">—</div>
        <div class="stat-card-sub">Across all users</div>
      </div>
      <div class="stat-card c-teal">
        <div class="stat-card-top">
          <div class="stat-card-label">New This Week</div>
          <div class="stat-card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        </div>
        <div class="stat-card-val" id="stat-week">—</div>
        <div class="stat-card-sub">Registered last 7 days</div>
      </div>
    </div>
  </div>

  <div class="users-card">
    <div class="users-card-header">
      <div class="users-card-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="users-card-title-text">All Users</span>
        <span class="users-count-badge" id="users-count"></span>
      </div>
      <div class="users-card-actions">
        <div class="search-bar">
          <div class="search-bar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
          <input id="search-input" type="text" placeholder="Search name or email…" />
        </div>
        <button class="btn btn-danger btn-sm btn-bulk-del" id="bulk-delete-users-btn" onclick="bulkDeleteUsers()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
          <span>Delete</span>
        </button>
        <div class="filter-btn-wrap">
          <button class="btn btn-secondary btn-sm" id="filter-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            Filter
          </button>
          <div class="filter-dot" id="filter-dot"></div>
        </div>
        <button class="btn btn-ghost btn-sm" id="refresh-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.76"/></svg>
        </button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="td-check"><input type="checkbox" id="sel-all-users" onchange="toggleSelectAllUsers(this.checked)" /></th>
            <th>ID</th>
            <th>User</th>
            <th>Email</th>
            <th>Registered</th>
            <th>Files</th>
            <th>Storage</th>
            <th>Workspaces</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="8" class="table-empty"><div class="spin-wrap"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>

    <div class="table-pagination">
      <div class="pagination" id="users-pagination"></div>
    </div>
  </div>

</main>

<script src="../js/config.js"></script>
<script src="../js/fetch/admin/admin-fetch.js"></script>
<script src="../js/admin/admin.js"></script>
</body>
</html>
