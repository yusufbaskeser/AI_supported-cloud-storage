<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — SynapseCloud</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/public/index.css" />
  <link rel="stylesheet" href="css/particles.css" />
  <link rel="stylesheet" href="css/app/app.css" />
  <link rel="stylesheet" href="css/app/profile.css" />
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('sc-theme')||'light');</script>
</head>
<body class="app-body">

  <div id="navbar-placeholder"></div>

  
  <section class="profile-hero">
    <div id="profile-particles" class="particles-interactive"></div>
    <div class="profile-hero-content">
      <div class="profile-hero-avatar" id="profileHeroAvatar">
        <img id="profileAvatarImg" alt="Avatar" style="display:none;width:100%;height:100%;object-fit:cover;" />
        <span id="profileAvatarInitial">?</span>
      </div>
      <h1 class="profile-hero-name" id="profileHeroName">—</h1>
      <p class="profile-hero-email" id="profileHeroEmail">—</p>
      <div class="profile-hero-badges">
        <span class="profile-hero-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Member since <span id="profileMemberSince">—</span>
        </span>
        <span class="profile-hero-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          <span id="profileStorageText">— used</span>
        </span>
      </div>
      <button class="profile-logout-btn" onclick="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
    <a href="profile-edit" class="profile-hero-edit-btn" title="Edit profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Edit Profile
    </a>
  </section>

  
  <div class="app-content profile-stats-content">
    <div class="profile-stats-row" id="profileStatsRow">
      <div class="profile-stat-chip skeleton" style="height:82px;"></div>
      <div class="profile-stat-chip skeleton" style="height:82px;"></div>
      <div class="profile-stat-chip skeleton" style="height:82px;"></div>
      <div class="profile-stat-chip skeleton" style="height:82px;"></div>
    </div>
  </div>

  
  <section class="profile-funfact-section">
    <div id="profile-fact-particles" class="particles-interactive"></div>
    <div class="profile-funfact-inner">
      <p class="profile-funfact-eyebrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Did you know?
      </p>
      <p class="profile-funfact-text" id="profileFunFactText">Loading…</p>
    </div>
  </section>

  
  <div class="app-content profile-danger-wrapper">
    <div class="profile-danger-card">
      <div class="profile-danger-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Danger Zone
      </div>
      <div class="profile-danger-body">
        <div>
          <div class="profile-danger-label">Delete Account</div>
          <div class="profile-danger-desc">Permanently delete your account, all workspaces, and all uploaded files. This cannot be undone.</div>
        </div>
        <button class="btn-danger" onclick="confirmDeleteAccount()">Delete Account</button>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="vendor/tsparticles.min.js"></script>
  <script src="js/shared/particles.js"></script>
  <script src="js/fetch/app/workspace-fetch.js"></script>
  <script src="js/fetch/app/file-fetch.js"></script>
  <script src="js/fetch/app/user-fetch.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app/app-common.js"></script>
  <script src="js/app/profile.js"></script>
</body>
</html>
